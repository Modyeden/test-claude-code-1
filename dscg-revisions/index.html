<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Révisions DSCG</title>
  <meta name="theme-color" content="#030b1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DSCG">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="tabs" aria-label="Navigation principale">
    <div class="brand"><img src="icon.svg" alt="" width="32" height="32"><span>Révisions<br>DSCG</span></div>
    <button data-tab="dashboard"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Accueil</span></button>
    <button data-tab="ue"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v13a2 2 0 012-2h6z"/></svg><span>Programme</span></button>
    <button data-tab="annales"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg><span>Annales</span></button>
    <button data-tab="planning"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Planning</span></button>
    <button data-tab="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Réglages</span></button>
  </nav>

  <div class="shell">
    <header class="topbar">
      <h1 id="page-title">Accueil</h1>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>

  <dialog id="lightbox" aria-label="Image agrandie">
    <button class="btn ghost" data-close="1">Fermer</button>
    <img alt="Image agrandie">
  </dialog>

  <script src="app.js"></script>
</body>
</html>
